version: '3.8'

services:
  # Primary Database (PostgreSQL + TimescaleDB extension)
  postgres:
    image: timescale/timescaledb:latest-pg15-oss
    container_name: stocksense-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=stocksense
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=stocksense_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Queues and Caching (Redis)
  redis:
    image: redis:7-alpine
    container_name: stocksense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Ingestion & Data Lake Cold Storage (MinIO)
  minio:
    image: minio/minio
    container_name: stocksense-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
